name: Deploy stack

on:
  workflow_dispatch:
    inputs:
      master_ip:
        description: Master ip
        type: string
        default: ""
        required: true
      ssh_user:
        description: SSH user
        type: string
        required: true
        default: ""
      environment:
        description: Environment
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - demo
      action:
        description: Action
        required: true
        type: choice
        default: "deploy"
        options:
          - deploy
          - delete

jobs:
  deploy_stack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Setup pulumi
        uses: pulumi/actions@v6

      # - name: Download previous pulumi state
      #   uses: actions/download-artifact@v5
      #   with:
      #     name: pulumi-state-${{ github.event.inputs.environment }}
      #     path: ./infra/.pulumi/
      #   continue-on-error: true

      - name: Setup ssh
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat > ~/.ssh/config << 'EOF'
          Host *
          StrictHostKeyChecking no
          EOF

      - name: Create kube config
        run: |
          SSH_USER=${{ github.event.inputs.ssh_user }}
          MASTER_IP=${{ github.event.inputs.master_ip }}
          mkdir -p ~/.kube
          ssh $SSH_USER@$MASTER_IP cat "/etc/rancher/k3s/k3s.yaml" > ~/.kube/config
          chmod 600 ~/.kube/config
          sed -i "s/127.0.0.1/$MASTER_IP/g" ~/.kube/config

      - name: Install dependencies
        working-directory: ./infra
        run: npm install

      - name: Pulumi login
        working-directory: ./infra
        run: pulumi login --local

      - name: Choose stack
        working-directory: ./infra
        env:
          PULUMI_CONFIG_PASSPHRASE: ""
        run: |
          pulumi stack select ${{ github.event.inputs.environment }} --create

      - name: Deploy stack
        if: ${{ github.event.inputs.action == 'deploy' }}
        working-directory: ./infra
        env:
          PULUMI_CONFIG_PASSPHRASE: ""
        run: pulumi up --yes

      - name: Debug - Find Pulumi state files
        if: github.event.inputs.action == 'deploy'
        run: |
          echo "=== Current directory ==="
          pwd

          echo "=== List infra directory ==="
          ls -la ./infra/

          echo "=== Check for .pulumi in infra ==="
          ls -la ./infra/.pulumi/ 2>/dev/null || echo "./infra/.pulumi/ does NOT exist"

          echo "=== Check home .pulumi ==="
          ls -la ~/.pulumi/ 2>/dev/null || echo "~/.pulumi/ does NOT exist"

          echo "=== Find ALL .pulumi directories ==="
          find . -name ".pulumi" -type d 2>/dev/null

          echo "=== Find stack state files ==="
          find . -name "*.json" -o -name "*.checkpoint" 2>/dev/null | grep -i pulumi

          echo "=== Pulumi whoami ==="
          pulumi whoami -v

          echo "=== List stacks ==="
          cd ./infra && pulumi stack ls --json

      # - name: Save pulumi state
      #   if: ${{ github.event.inputs.action == 'deploy' }}
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: pulumi-state-${{ github.event.inputs.environment }}
      #     path: ./infra/.pulumi/
      #     retention-days: 400

      - name: Remove stack
        if: ${{ github.event.inputs.action == 'delete' }}
        working-directory: ./infra
        env:
          PULUMI_CONFIG_PASSPHRASE: ""
        run: |
          pulumi destroy --yes
          pulumi stack rm ${{ github.event.inputs.environment }} --yes --force

      - name: Delete pulumi state
        if: ${{ github.event.inputs.action == 'delete' }}
        uses: geekyeggo/delete-artifact@v5
        with:
          name: pulumi-state-${{ github.event.inputs.environment }}
        continue-on-error: true
