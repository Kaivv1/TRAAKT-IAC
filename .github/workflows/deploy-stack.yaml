name: Deploy stack

on:
  workflow_dispatch:
    inputs:
      ssh_user:
        description: SSH user
        type: string
        required: true
        default: ""
      master_ip:
        description: Master ip
        type: string
        default: ""
        required: true
      deploy_dev_services:
        description: Deploy dev services
        type: boolean
        default: false
      deploy_demo_services:
        description: Deploy demo services
        type: boolean
        default: false
      action:
        description: Action
        required: true
        type: choice
        default: "deploy"
        options:
          - deploy
          - delete

jobs:
  deploy_stack:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
      id-token: write
    env:
      PULUMI_CONFIG_PASSPHRASE: ""
      K8S_AUDIENCE: ${{ secrets.K8S_AUDIENCE }}
      SSH_USER: ${{ github.event.inputs.ssh_user }}
      MASTER_IP: ${{ github.event.inputs.master_ip }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Setup pulumi
        uses: pulumi/actions@v6

      - name: Setup SSH
        uses: ./.github/actions/setup-ssh
        with:
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Setup k3s auth
        uses: ./.github/actions/setup-k3s-auth
        with:
          master_ip: "$MASTER_IP"
          k3s_cert: ${{ secrets.K3S_CERT }}

      - name: Copy pulumi state
        run: |
          mkdir -p /home/runner/.pulumi/stacks
          echo "Copying pulumi state..."
          scp -r $SSH_USER@$MASTER_IP:/var/pulumi/state/.pulumi/stacks/* ~/.pulumi/stacks/ 2>/dev/null && echo "Pulumi state copied" || echo "No pulumi state found"

      - name: Install dependencies
        working-directory: ./infra
        run: npm install

      - name: Pulumi login
        run: pulumi login --local

      - name: Deploy
        if: ${{ github.event.inputs.action == 'deploy' }}
        working-directory: ./infra
        run: |
          pulumi stack select infra || \
          pulumi stack select infra --create

          pulumi config set --path 'service-environment.dev.enabled' ${{ github.event.inputs.deploy_dev_services }}
          pulumi config set --path 'service-environment.demo.enabled' ${{ github.event.inputs.deploy_demo_services }}

          pulumi up --yes --skip-preview

      - name: Destroy
        if: ${{ github.event.inputs.action == 'delete' }}
        working-directory: ./infra
        run: |
          pulumi destroy -s infra --yes --skip-preview

      - name: Save pulumi state
        run: |
          echo "Saving pulumi state..."
          scp -r ~/.pulumi/stacks/* $SSH_USER@$MASTER_IP:/var/pulumi/state/.pulumi/stacks/
          echo "Pulumi state saved"
